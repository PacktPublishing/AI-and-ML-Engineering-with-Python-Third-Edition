[project]
name = "protocols"
version = "0.1.0"
description = "Minimal MCP and A2A servers and clients, side by side, so the two protocols can be compared directly."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.4",
    "anyio>=4.0",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Pyflakes, pycodestyle, isort, pyupgrade, flake8-bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
